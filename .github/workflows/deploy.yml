name: Deploy Next.js (static) via SSH

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run build
            - run: ls -la out

            - name: Deploy with password
              env:
                  LFTP_PASSWORD: ${{ secrets.SSH_PASSWORD }}
              run: |
                  lftp -u "${{ secrets.SSH_USER }}" -p ${{ secrets.SSH_PORT }} sftp://${{ secrets.SSH_HOST }} <<'EOF'
                  set sftp:auto-confirm yes
                  set net:max-retries 2
                  mirror -R --delete --verbose out/ ${{ secrets.TARGET_DIR }}
                  bye
                  EOF
