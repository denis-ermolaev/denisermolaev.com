<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Подпись — Денис Ермолаев</title>
</head>
<body>
<!-- Подпись — единая таблица, чтобы разделители не вырезались при ответе -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
	<!-- Разделитель ДО — на всю ширину письма -->
	<tr>
		<td style="height: 2px; background-color: #E39A8C; font-size: 1px; line-height: 1px;">&nbsp;</td>
	</tr>
	<!-- Отступ 4px -->
	<tr>
		<td style="height: 4px; font-size: 1px; line-height: 1px;">&nbsp;</td>
	</tr>
	<!-- Контент подписи -->
	<tr>
		<td align="center" style="text-align: center;">
			<table cellpadding="0" cellspacing="0" border="0" role="presentation" align="center" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.4; color: #374151;">
				<tr>
					<!-- Portrait -->
					<td valign="middle" style="vertical-align: middle; padding-right: 20px;">
						<img
							src="https://denisermolaev.com/signature/portrait256-256.jpg"
							alt="Денис Ермолаев"
							width="96"
							height="96"
							style="display: block; border-radius: 12px; max-width: 96px;"
						/>
					</td>

					<!-- Info -->
					<td valign="middle" style="vertical-align: middle;">
						<!-- Name + divider (линия сохранена, текст должности убран) -->
						<div style="font-size: 20px; font-weight: 700; color: #111827; line-height: 1.3; letter-spacing: -0.01em; padding-bottom: 10px; border-bottom: 2px solid #E39A8C; margin-bottom: 10px;">
							Денис Ермолаев
						</div>

						<!-- Contacts: 3 columns (2+2+1) -->
						<table cellpadding="0" cellspacing="0" border="0" role="presentation">
							<tr>
								<!-- Column 1: Telegram, Email (главные) -->
								<td valign="top" style="vertical-align: top; padding-right: 24px;">
									<table cellpadding="0" cellspacing="0" border="0" role="presentation">
										<!-- Telegram -->
										<tr>
											<td valign="middle" style="vertical-align: middle; padding-bottom: 5px; width: 20px;">
												<img
													src="https://denisermolaev.com/signature/ic--baseline-telegram.png"
													alt=""
													width="16"
													height="16"
													style="display: block; width: 16px; height: 16px;"
												/>
											</td>
											<td valign="middle" style="vertical-align: middle; padding-bottom: 5px; padding-left: 8px;">
												<a
													href="https://t.me/first_millennium"
													target="_blank"
													rel="noopener noreferrer"
													style="text-decoration: none; color: #374151; font-size: 14px; white-space: nowrap;"
												>Telegram</a>
											</td>
										</tr>
										<!-- Email -->
										<tr>
											<td valign="middle" style="vertical-align: middle; width: 20px;">
												<img
													src="https://denisermolaev.com/signature/line-md--email.png"
													alt=""
													width="16"
													height="16"
													style="display: block; width: 16px; height: 16px;"
												/>
											</td>
											<td valign="middle" style="vertical-align: middle; padding-left: 8px;">
												<a
													href="mailto:me@denisermolaev.com"
													style="text-decoration: none; color: #374151; font-size: 14px; white-space: nowrap;"
												>me@denisermolaev.com</a>
											</td>
										</tr>
									</table>
								</td>
								<!-- Column 2: Website, GitHub -->
								<td valign="top" style="vertical-align: top; padding-right: 24px;">
									<table cellpadding="0" cellspacing="0" border="0" role="presentation">
										<!-- Website -->
										<tr>
											<td valign="middle" style="vertical-align: middle; padding-bottom: 5px; width: 20px;">
												<img
													src="https://denisermolaev.com/signature/gg--external.png"
													alt=""
													width="16"
													height="16"
													style="display: block; width: 16px; height: 16px;"
												/>
											</td>
											<td valign="middle" style="vertical-align: middle; padding-bottom: 5px; padding-left: 8px;">
												<a
													href="https://denisermolaev.com"
													target="_blank"
													rel="noopener noreferrer"
													style="text-decoration: none; color: #374151; font-size: 14px; white-space: nowrap;"
												>denisermolaev.com</a>
											</td>
										</tr>
										<!-- GitHub -->
										<tr>
											<td valign="middle" style="vertical-align: middle; width: 20px;">
												<img
													src="https://denisermolaev.com/signature/mdi--github.png"
													alt=""
													width="16"
													height="16"
													style="display: block; width: 16px; height: 16px;"
												/>
											</td>
											<td valign="middle" style="vertical-align: middle; padding-left: 8px;">
												<a
													href="https://github.com/denis-ermolaev"
													target="_blank"
													style="text-decoration: none; color: #374151; font-size: 14px; white-space: nowrap;"
												>GitHub</a>
											</td>
										</tr>
									</table>
								</td>
								<!-- Column 3: LinkedIn -->
								<td valign="top" style="vertical-align: top;">
									<table cellpadding="0" cellspacing="0" border="0" role="presentation">
										<!-- LinkedIn -->
										<tr>
											<td valign="middle" style="vertical-align: middle; width: 20px;">
												<img
													src="https://denisermolaev.com/signature/mdi--linkedin.png"
													alt=""
													width="16"
													height="16"
													style="display: block; width: 16px; height: 16px;"
												/>
											</td>
											<td valign="middle" style="vertical-align: middle; padding-left: 8px;">
												<a
													href="https://www.linkedin.com/in/ermolaev-denis/"
													target="_blank"
													rel="noopener noreferrer"
													style="text-decoration: none; color: #374151; font-size: 14px; white-space: nowrap;"
												>LinkedIn</a>
											</td>
										</tr>
									</table>
								</td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
		</td>
	</tr>
	<!-- Отступ 4px -->
	<tr>
		<td style="height: 4px; font-size: 1px; line-height: 1px;">&nbsp;</td>
	</tr>
	<!-- Разделитель ПОСЛЕ — на всю ширину письма -->
	<tr>
		<td style="height: 2px; background-color: #E39A8C; font-size: 1px; line-height: 1px;">&nbsp;</td>
	</tr>
</table>

</html>
